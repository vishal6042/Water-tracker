<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1565C0" />
<meta name="description" content="Water Tracker — track your daily water intake, set a glass goal, and view your history." />
<title>Water Tracker</title>
<style>
  :root {
    --blue-50:  #E9F3FF;
    --blue-100: #D2E7FF;
    --blue-200: #A7CCFF;
    --blue-300: #6FA8F5;
    --blue-400: #3D8BF0;
    --blue-500: #2196F3;
    --blue-600: #1565C0;
    --blue-700: #0D47A1;
    --ink:      #0B2545;
    --ink-soft: #5B7599;
    --card:     #FFFFFF;
    --ring-track: #DCEBFF;
    --goal:     #F59E0B;
    --shadow: 0 18px 40px -18px rgba(13, 71, 161, .45);
    --radius: 22px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #2b6fd6 0%, transparent 60%),
      radial-gradient(1000px 700px at 100% 10%, #0d47a1 0%, transparent 55%),
      linear-gradient(160deg, #1e88e5 0%, #0d47a1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    color: var(--ink);
  }

  /* ---------- Phone frame ---------- */
  .phone {
    width: 100%;
    max-width: 390px;
    height: min(844px, calc(100vh - 32px));
    background: linear-gradient(180deg, var(--blue-50) 0%, #ffffff 42%);
    border-radius: 40px;
    box-shadow: var(--shadow), 0 0 0 10px rgba(255,255,255,.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  @media (max-width: 430px) {
    body { padding: 0; }
    .phone { border-radius: 0; height: 100vh; max-width: 100%; box-shadow: none; }
  }

  .statusbar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    font-size: 13px; font-weight: 600; color: var(--blue-700);
    flex: 0 0 auto;
  }
  .statusbar .dots { letter-spacing: 2px; opacity: .7; }

  /* ---------- Header ---------- */
  header.app {
    padding: 4px 22px 10px;
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .drop {
    width: 34px; height: 34px; border-radius: 12px;
    background: linear-gradient(180deg, var(--blue-400), var(--blue-600));
    display: grid; place-items: center;
    box-shadow: 0 8px 16px -6px rgba(21,101,192,.7);
  }
  .brand h1 { font-size: 19px; margin: 0; color: var(--ink); font-weight: 800; letter-spacing: -.2px; }
  .brand p { margin: 0; font-size: 11.5px; color: var(--ink-soft); }

  .tabs {
    display: inline-flex; background: var(--blue-100); border-radius: 999px; padding: 3px;
  }
  .tabs button {
    border: 0; background: transparent; cursor: pointer;
    font-size: 12.5px; font-weight: 700; color: var(--blue-700);
    padding: 7px 14px; border-radius: 999px; transition: .2s;
  }
  .tabs button.active { background: #fff; color: var(--blue-600); box-shadow: 0 3px 8px -3px rgba(13,71,161,.4); }

  /* ---------- Scroll body ---------- */
  .content { flex: 1 1 auto; overflow-y: auto; padding: 4px 20px 24px; }
  .content::-webkit-scrollbar { width: 0; }
  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Progress ring ---------- */
  .ring-wrap { display: grid; place-items: center; margin: 8px 0 14px; position: relative; }
  .ring-svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--ring-track); }
  .ring-fill {
    stroke: url(#grad);
    stroke-linecap: round;
    transition: stroke-dashoffset .45s cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .ring-fill { transition: none; }
  }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .ring-center .count { font-size: 46px; font-weight: 800; color: var(--ink); line-height: 1; }
  .ring-center .count small { font-size: 20px; color: var(--ink-soft); font-weight: 700; }
  .ring-center .ml { margin-top: 6px; font-size: 15px; font-weight: 700; color: var(--blue-600); }
  .ring-center .pct { margin-top: 2px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }

  .goal-banner {
    margin: 0 auto 14px; max-width: 300px;
    background: linear-gradient(180deg, var(--blue-500), var(--blue-600));
    color: #fff; border-radius: 14px; padding: 10px 14px; text-align: center;
    font-size: 13.5px; font-weight: 700; box-shadow: 0 10px 20px -10px rgba(13,71,161,.8);
    display: none;
  }
  .goal-banner.show { display: block; animation: pop .4s ease; }
  @keyframes pop { 0%{transform:scale(.9);opacity:0} 60%{transform:scale(1.03)} 100%{transform:scale(1);opacity:1} }

  /* ---------- Controls ---------- */
  .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .btn {
    border: 0; cursor: pointer; font-weight: 800; font-size: 15px;
    border-radius: 16px; padding: 14px 18px; transition: transform .08s, box-shadow .2s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn-add {
    flex: 1; max-width: 200px; color: #fff;
    background: linear-gradient(180deg, var(--blue-400), var(--blue-600));
    box-shadow: 0 12px 22px -10px rgba(21,101,192,.9);
  }
  .btn-remove {
    color: var(--blue-700); background: var(--blue-100);
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: 0 10px 30px -20px rgba(13,71,161,.55); border: 1px solid #EAF2FE;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 14px; color: var(--ink); font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
  .card h2 span.sub { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }

  /* Goal setter */
  .goal-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .goal-row .label { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .goal-row .label b { color: var(--ink); font-size: 15px; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-50); border-radius: 12px; padding: 4px; }
  .stepper button {
    width: 34px; height: 34px; border: 0; border-radius: 9px; cursor: pointer;
    background: #fff; color: var(--blue-600); font-size: 20px; font-weight: 800;
    box-shadow: 0 2px 6px -3px rgba(13,71,161,.5); line-height: 1;
  }
  .stepper .val { min-width: 30px; text-align: center; font-weight: 800; font-size: 17px; color: var(--ink); }

  /* Today log */
  .log-list { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .log-list::-webkit-scrollbar { width: 0; }
  .log-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid #F0F6FF;
  }
  .log-item:last-child { border-bottom: 0; }
  .log-item .ic {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: var(--blue-100); display: grid; place-items: center;
  }
  .log-item .t { font-weight: 700; font-size: 14px; color: var(--ink); }
  .log-item .v { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 18px 0; }

  /* History */
  .hist-tabs { display: inline-flex; background: var(--blue-50); border-radius: 12px; padding: 3px; margin-bottom: 6px; }
  .hist-tabs button {
    border: 0; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 700;
    color: var(--blue-700); padding: 7px 14px; border-radius: 9px; transition: .2s;
  }
  .hist-tabs button.active { background: #fff; color: var(--blue-600); box-shadow: 0 3px 8px -4px rgba(13,71,161,.4); }
  /* History navigation */
  .hist-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 12px; }
  .hist-nav .nav-btn {
    width: 36px; height: 36px; border: 0; border-radius: 11px; cursor: pointer;
    background: var(--blue-50); color: var(--blue-600); font-size: 20px; font-weight: 800; line-height: 1;
    box-shadow: 0 2px 6px -3px rgba(13,71,161,.5);
  }
  .hist-nav .nav-btn:disabled { opacity: .32; cursor: default; box-shadow: none; }
  .hist-period { font-size: 15px; font-weight: 800; color: var(--ink); }

  /* Column (bar) chart */
  .chart-scale { font-size: 11px; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; }
  .chart {
    display: flex; align-items: stretch; gap: 4px;
    padding: 0 10px 4px; overflow: hidden;   /* clip sub-pixel width rounding; content fits vertically */
  }
  .col {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
  }
  .col-plot {
    position: relative;
    width: 100%; height: 172px;                 /* fixed plot area: 150px bars + headroom for value */
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 5px;
    border-bottom: 2px solid #DCE8F9;           /* baseline axis */
  }
  .col-val { font-size: 11px; font-weight: 800; color: var(--blue-700); font-variant-numeric: tabular-nums; line-height: 1; }
  .chart.dense .col-val { display: none; }       /* too many bars to label each */
  .col-bar {
    width: 62%; max-width: 26px; min-width: 3px;
    background: linear-gradient(180deg, var(--blue-300), var(--blue-600));
    border-radius: 5px 5px 2px 2px;
    transition: height .45s cubic-bezier(.4,0,.2,1);
  }
  .col.current .col-bar { background: linear-gradient(180deg, var(--blue-500), var(--blue-700)); box-shadow: 0 6px 14px -6px rgba(13,71,161,.65); }
  .col.sel .col-bar { outline: 2px solid var(--blue-700); outline-offset: 1px; }
  .col-lbl { font-size: 10px; line-height: 1.3; font-weight: 700; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 6px; }
  .col.current .col-lbl { color: var(--blue-600); }
  /* Goal reference line (dashed, per column so it steps for yearly and reads level for monthly) */
  .goal-tick { position: absolute; left: 4%; right: 4%; border-top: 2px dashed var(--goal); pointer-events: none; }
  .chart-legend { display: flex; gap: 16px; align-items: center; justify-content: center; font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 10px; }
  .chart-legend .sw { display: inline-block; width: 16px; height: 0; border-top: 2px dashed var(--goal); vertical-align: middle; margin-right: 6px; }
  .chart-legend .sw.bar { height: 11px; width: 8px; border: 0; border-radius: 2px; background: linear-gradient(180deg, var(--blue-300), var(--blue-600)); }
  .hist-readout { text-align: center; font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-top: 8px; min-height: 16px; }
  .hist-readout b { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .col-bar { transition: none; } }

  .totals { display: flex; gap: 10px; margin-bottom: 14px; }
  .totals .stat { flex: 1; background: linear-gradient(180deg, var(--blue-50), #fff); border: 1px solid #EAF2FE; border-radius: 16px; padding: 12px; text-align: center; }
  .totals .stat .n { font-size: 22px; font-weight: 800; color: var(--blue-600); }
  .totals .stat .k { font-size: 11px; color: var(--ink-soft); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span id="clock">--:--</span>
      <span class="dots">Water Tracker</span>
      <span>▲ ● ▮</span>
    </div>

    <header class="app">
      <div class="brand">
        <span class="drop" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2.5c4 5 6.5 8 6.5 11.2A6.5 6.5 0 0 1 5.5 13.7C5.5 10.5 8 7.5 12 2.5Z" fill="#fff"/>
          </svg>
        </span>
        <div>
          <h1>Water Tracker</h1>
          <p>Stay hydrated every day</p>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-today" class="active" role="tab">Today</button>
        <button id="tab-history" role="tab">History</button>
      </div>
    </header>

    <div class="content">
      <!-- ================= TODAY VIEW ================= -->
      <section id="view-today" class="view active">
        <div class="ring-wrap">
          <svg class="ring-svg" width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#64B5F6"/>
                <stop offset="100%" stop-color="#1565C0"/>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="110" cy="110" r="96" fill="none" stroke-width="18"/>
            <circle id="ringFill" class="ring-fill" cx="110" cy="110" r="96" fill="none" stroke-width="18"
                    stroke-dasharray="603.2" stroke-dashoffset="603.2"/>
          </svg>
          <div class="ring-center">
            <div class="count"><span id="curCount">0</span><small> / <span id="tgtCount">8</span></small></div>
            <div class="ml"><span id="curMl">0</span> ml</div>
            <div class="pct"><span id="pct">0</span>% of goal</div>
          </div>
        </div>

        <div id="goalBanner" class="goal-banner">🎉 Goal reached! Great job staying hydrated.</div>

        <div class="controls">
          <button id="removeBtn" class="btn btn-remove">−</button>
          <button id="addBtn" class="btn btn-add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
            Add Glass
          </button>
        </div>

        <div class="card">
          <div class="goal-row">
            <div class="label">Daily goal<br><b id="goalVol">2000 ml</b></div>
            <div class="stepper">
              <button id="goalMinus" aria-label="Decrease goal">−</button>
              <span class="val" id="goalVal">8</span>
              <button id="goalPlus" aria-label="Increase goal">+</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Today's Log <span class="sub" id="logSub">250 ml per glass</span></h2>
          <ul id="logList" class="log-list"></ul>
        </div>
      </section>

      <!-- ================= HISTORY VIEW ================= -->
      <section id="view-history" class="view">
        <div class="totals">
          <div class="stat"><div class="n" id="stGlasses">0</div><div class="k">Glasses</div></div>
          <div class="stat"><div class="n" id="stLitres">0 L</div><div class="k">Total</div></div>
          <div class="stat"><div class="n" id="stDays">0</div><div class="k">Days</div></div>
        </div>

        <div class="card">
          <h2>History
            <span class="hist-tabs">
              <button id="h-daily" class="active">Daily</button>
              <button id="h-monthly">Monthly</button>
              <button id="h-yearly">Yearly</button>
            </span>
          </h2>
          <div class="hist-nav">
            <button id="histPrev" class="nav-btn" aria-label="Previous">‹</button>
            <span id="histPeriod" class="hist-period">—</span>
            <button id="histNext" class="nav-btn" aria-label="Next">›</button>
          </div>
          <div id="histBody"></div>
        </div>
      </section>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var GLASS_ML = 250;
  var STORE_KEY = "waterTracker.v1";
  var MAX_GLASSES = 40;

  // ---------- State ----------
  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        return { target: p.target || 8, entries: Array.isArray(p.entries) ? p.entries : [] };
      }
    } catch (e) {}
    return { target: 8, entries: [] };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- Date helpers ----------
  function dayKey(d)   { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function monthKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function yearKey(d)  { return "" + d.getFullYear(); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function isToday(ts) {
    var d = new Date(ts), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }
  function todayEntries() {
    return state.entries.filter(function (ts) { return isToday(ts); })
                        .sort(function (a, b) { return b - a; });
  }

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var ringFill = $("ringFill");
  var CIRC = 2 * Math.PI * 96; // 603.18

  // ---------- Render ----------
  function render() {
    var today = todayEntries();
    var cur = today.length;
    var tgt = state.target;

    $("curCount").textContent = cur;
    $("tgtCount").textContent = tgt;
    $("curMl").textContent = (cur * GLASS_ML).toLocaleString();
    var frac = tgt > 0 ? Math.min(cur / tgt, 1) : 0;
    $("pct").textContent = Math.round(frac * 100);
    ringFill.setAttribute("stroke-dashoffset", (CIRC * (1 - frac)).toFixed(1));

    $("goalVal").textContent = tgt;
    $("goalVol").textContent = (tgt * GLASS_ML).toLocaleString() + " ml";
    $("goalBanner").classList.toggle("show", cur >= tgt && tgt > 0);

    renderLog(today);
    if ($("view-history").classList.contains("active")) renderHistory();
    save();
  }

  function renderLog(today) {
    var list = $("logList");
    if (!today.length) {
      list.innerHTML = '<li class="empty">No glasses logged yet today.<br>Tap “Add Glass” to start 💧</li>';
      return;
    }
    var html = "";
    for (var i = 0; i < today.length; i++) {
      var t = new Date(today[i]).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      html += '<li class="log-item">' +
                '<span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2.5c4 5 6.5 8 6.5 11.2A6.5 6.5 0 0 1 5.5 13.7C5.5 10.5 8 7.5 12 2.5Z" fill="#1565C0"/></svg></span>' +
                '<span class="t">' + t + '</span>' +
                '<span class="v">+' + GLASS_ML + ' ml</span>' +
              '</li>';
    }
    list.innerHTML = html;
  }

  // ---------- History ----------
  var histMode = "daily";
  var histCursor = new Date();   // reference date; interpreted per mode (its day / month / year)
  var histAtPresent = true;      // whether the viewed period is the current one (gates "next")

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function sameYMD(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function niceCeil(v) {
    v = Math.max(v, 1);
    if (v <= 5) return Math.ceil(v);
    if (v <= 10) return Math.ceil(v / 2) * 2;
    if (v <= 50) return Math.ceil(v / 5) * 5;
    if (v <= 100) return Math.ceil(v / 10) * 10;
    return Math.ceil(v / 25) * 25;
  }

  // Build the series (rows) + meta for the current mode & cursor.
  function buildSeries() {
    var now = new Date();
    var tgt = state.target;
    var y = histCursor.getFullYear(), m = histCursor.getMonth(), d = histCursor.getDate();
    var rows = [], periodLabel = "", atPresent = false, unit = "", summary = "";

    if (histMode === "daily") {
      var day = new Date(y, m, d);
      var isToday = sameYMD(day, now);
      var buckets = new Array(24).fill(0), dayTotal = 0;
      state.entries.forEach(function (ts) {
        var e = new Date(ts);
        if (sameYMD(e, day)) { buckets[e.getHours()]++; dayTotal++; }
      });
      for (var h = 0; h < 24; h++) {
        rows.push({
          count: buckets[h],
          short: (h % 4 === 0 || h === 23) ? (pad(h) + ":00") : "",
          full: pad(h) + ":00",
          current: isToday && h === now.getHours(),
          goal: null
        });
      }
      periodLabel = day.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" });
      atPresent = isToday;
      unit = "hour";
      summary = "<b>" + dayTotal + "</b> / " + tgt + " glasses · " + (dayTotal * GLASS_ML).toLocaleString() + " ml";
    } else if (histMode === "monthly") {
      var dim = daysInMonth(y, m);
      var mBuckets = new Array(dim + 1).fill(0), mTotal = 0;
      state.entries.forEach(function (ts) {
        var e = new Date(ts);
        if (e.getFullYear() === y && e.getMonth() === m) { mBuckets[e.getDate()]++; mTotal++; }
      });
      for (var dd = 1; dd <= dim; dd++) {
        rows.push({
          count: mBuckets[dd],
          short: (dd === 1 || dd === dim || (dd % 5 === 0 && dim - dd >= 2)) ? ("" + dd) : "",
          full: new Date(y, m, dd).toLocaleDateString([], { month: "short", day: "numeric" }),
          current: y === now.getFullYear() && m === now.getMonth() && dd === now.getDate(),
          goal: tgt   // each day's goal is the daily target
        });
      }
      periodLabel = histCursor.toLocaleDateString([], { month: "long", year: "numeric" });
      atPresent = y === now.getFullYear() && m === now.getMonth();
      unit = "day";
      summary = "<b>" + mTotal + "</b> glasses this month · " + (mTotal * GLASS_ML / 1000).toFixed(1) + " L";
    } else { // yearly
      var yBuckets = new Array(12).fill(0), yTotal = 0;
      state.entries.forEach(function (ts) {
        var e = new Date(ts);
        if (e.getFullYear() === y) { yBuckets[e.getMonth()]++; yTotal++; }
      });
      for (var mo = 0; mo < 12; mo++) {
        rows.push({
          count: yBuckets[mo],
          short: new Date(y, mo, 1).toLocaleDateString([], { month: "short" }),
          full: new Date(y, mo, 1).toLocaleDateString([], { month: "long", year: "numeric" }),
          current: y === now.getFullYear() && mo === now.getMonth(),
          goal: tgt * daysInMonth(y, mo)   // month goal = daily goal × days in that month
        });
      }
      periodLabel = "" + y;
      atPresent = y === now.getFullYear();
      unit = "month";
      summary = "<b>" + yTotal + "</b> glasses in " + y + " · " + (yTotal * GLASS_ML / 1000).toFixed(1) + " L";
    }
    return { rows: rows, periodLabel: periodLabel, atPresent: atPresent, unit: unit, summary: summary };
  }

  function renderHistory() {
    var body = $("histBody");
    var s = buildSeries();
    var rows = s.rows;

    // Nav header
    $("histPeriod").textContent = s.periodLabel;
    histAtPresent = s.atPresent;
    $("histNext").disabled = s.atPresent;

    // All-time totals (top cards)
    var total = state.entries.length;
    var days = {};
    state.entries.forEach(function (ts) { days[dayKey(new Date(ts))] = 1; });
    $("stGlasses").textContent = total;
    $("stLitres").textContent = (total * GLASS_ML / 1000).toFixed(total * GLASS_ML % 1000 === 0 ? 0 : 1) + " L";
    $("stDays").textContent = Object.keys(days).length;

    if (total === 0) {
      body.innerHTML = '<div class="empty">No history yet.<br>Log some glasses on the Today tab 💧</div>';
      return;
    }

    var peak = rows.reduce(function (mx, r) { return Math.max(mx, r.count); }, 0);
    var goalMax = rows.reduce(function (mx, r) { return Math.max(mx, r.goal || 0); }, 0);
    var niceMax = niceCeil(Math.max(peak, goalMax));
    var PLOT_H = 150;
    var dense = rows.length > 12;

    var cols = rows.map(function (r, i) {
      var barPx = r.count > 0 ? Math.max(Math.round((r.count / niceMax) * PLOT_H), 3) : 0;
      var goalPx = r.goal != null ? Math.round((r.goal / niceMax) * PLOT_H) : 0;
      var cls = "col" + (r.current ? " current" : "");
      var title = r.full + ": " + r.count + " glass" + (r.count === 1 ? "" : "es") +
                  " · " + (r.count * GLASS_ML).toLocaleString() + " ml" +
                  (r.goal != null ? " (goal " + r.goal + ")" : "");
      return '<div class="' + cls + '" title="' + title + '"' +
                  ' data-full="' + r.full + '" data-count="' + r.count + '"' +
                  ' data-goal="' + (r.goal != null ? r.goal : "") + '">' +
               '<span class="col-plot">' +
                 (r.goal != null ? '<span class="goal-tick" style="bottom:' + goalPx + 'px"></span>' : '') +
                 (r.count > 0 ? '<span class="col-val">' + r.count + '</span>' : '') +
                 '<span class="col-bar" style="height:' + barPx + 'px"></span>' +
               '</span>' +
               '<span class="col-lbl">' + r.short + '</span>' +
             '</div>';
    }).join("");

    var legend = '<div class="chart-legend">' +
                   '<span><i class="sw bar"></i>Glasses</span>' +
                   (goalMax > 0 ? '<span><i class="sw"></i>Goal</span>' : '') +
                 '</div>';

    body.innerHTML =
      '<div class="chart-scale">Glasses per ' + s.unit + ' · peak ' + peak + ' · scale 0–' + niceMax + '</div>' +
      '<div class="chart' + (dense ? ' dense' : '') + '">' + cols + '</div>' +
      legend +
      '<div class="hist-readout" id="histReadout">' + s.summary + '</div>';
  }

  // ---------- Actions ----------
  $("addBtn").addEventListener("click", function () {
    if (todayEntries().length >= MAX_GLASSES) return;
    state.entries.push(Date.now());
    render();
  });
  $("removeBtn").addEventListener("click", function () {
    var today = todayEntries();
    if (!today.length) return;
    var latest = today[0]; // newest first
    var idx = state.entries.lastIndexOf(latest);
    if (idx > -1) state.entries.splice(idx, 1);
    render();
  });
  $("goalPlus").addEventListener("click", function () {
    if (state.target < MAX_GLASSES) { state.target++; render(); }
  });
  $("goalMinus").addEventListener("click", function () {
    if (state.target > 1) { state.target--; render(); }
  });

  // Tabs
  function showView(which) {
    var today = which === "today";
    $("view-today").classList.toggle("active", today);
    $("view-history").classList.toggle("active", !today);
    $("tab-today").classList.toggle("active", today);
    $("tab-history").classList.toggle("active", !today);
    if (!today) { histCursor = new Date(); renderHistory(); }  // open history on the present period
  }
  $("tab-today").addEventListener("click", function () { showView("today"); });
  $("tab-history").addEventListener("click", function () { showView("history"); });

  function setHist(mode) {
    histMode = mode;
    $("h-daily").classList.toggle("active", mode === "daily");
    $("h-monthly").classList.toggle("active", mode === "monthly");
    $("h-yearly").classList.toggle("active", mode === "yearly");
    renderHistory();
  }
  $("h-daily").addEventListener("click", function () { setHist("daily"); });
  $("h-monthly").addEventListener("click", function () { setHist("monthly"); });
  $("h-yearly").addEventListener("click", function () { setHist("yearly"); });

  // Prev / next period navigation
  function shiftHist(dir) {
    if (dir > 0 && histAtPresent) return;  // never navigate past the present
    var y = histCursor.getFullYear(), m = histCursor.getMonth(), d = histCursor.getDate();
    if (histMode === "daily") histCursor = new Date(y, m, d + dir);
    else if (histMode === "monthly") histCursor = new Date(y, m + dir, 1);
    else histCursor = new Date(y + dir, 0, 1);
    renderHistory();
  }
  $("histPrev").addEventListener("click", function () { shiftHist(-1); });
  $("histNext").addEventListener("click", function () { shiftHist(1); });

  // Tap a bar to read its exact value (works on mobile where there's no hover)
  $("histBody").addEventListener("click", function (ev) {
    var col = ev.target.closest ? ev.target.closest(".col") : null;
    if (!col) return;
    var chart = col.parentNode;
    var prev = chart.querySelector(".col.sel");
    if (prev) prev.classList.remove("sel");
    col.classList.add("sel");
    var c = +col.getAttribute("data-count");
    var g = col.getAttribute("data-goal");
    var out = $("histReadout");
    if (out) out.innerHTML = "<b>" + col.getAttribute("data-full") + "</b> · " + c +
      " glass" + (c === 1 ? "" : "es") + " · " + (c * GLASS_ML).toLocaleString() + " ml" +
      (g !== "" ? " · goal " + g : "");
  });

  // Clock
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  tick();
  setInterval(tick, 15000);

  render();
})();
</script>
</body>
</html>
